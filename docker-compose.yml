name: vibora

# Desarrollo (como siempre):  docker compose up -d db
# Stack completo:             docker compose --profile app up -d --build   (necesita .env, ver env.example)
# Los servicios backend y frontend llevan el perfil "app": sin --profile solo arranca la base de datos.

services:
  # Pre-flight del secreto JWT (solo con el perfil "app"). OBLIGATORIO, pero NO con ${VIBORA_JWT_SECRET:?...}:
  # compose interpola tambien los servicios de perfiles inactivos, y eso haria fallar `docker compose up -d db` en
  # desarrollo (sin .env). Asi, `up --profile app` sin un secreto valido (vacio, < 32 caracteres o el marcador de
  # env.example) aborta al instante con:  service "comprobar-VIBORA_JWT_SECRET" didn't complete successfully: exit 1
  # (el motivo exacto: `docker compose logs comprobar-VIBORA_JWT_SECRET`) y el backend NI SE CREA: nada de bucles de
  # reinicio. Reutiliza la imagen de la base de datos (ya descargada), asi que no baja nada nuevo.
  comprobar-VIBORA_JWT_SECRET:
    profiles: ["app"]
    image: postgres:17
    restart: "no"
    environment:
      VIBORA_JWT_SECRET: ${VIBORA_JWT_SECRET:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        s="$$VIBORA_JWT_SECRET"
        if [ "$${#s}" -lt 32 ] || [ "$${s#CAMBIAME}" != "$$s" ]; then
          echo "ERROR: define VIBORA_JWT_SECRET en .env (minimo 32 caracteres; no sirve el marcador CAMBIAME-... de env.example)." >&2
          echo "Genera uno:  node -e \"console.log(require('crypto').randomBytes(48).toString('base64'))\"" >&2
          exit 1
        fi


  db:
    image: postgres:17
    container_name: vibora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibora}
      POSTGRES_USER: ${POSTGRES_USER:-vibora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibora}
    ports:
      # 5433 en el host: el 5432 lo usa otro proyecto
      - "5433:5432"
    volumes:
      - vibora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibora} -d ${POSTGRES_DB:-vibora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./vibora-backend
    image: vibora-backend:local
    restart: unless-stopped
    environment:
      # Toda la configuracion por entorno (relaxed binding de Spring). Nada de esto va dentro de la imagen.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vibora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vibora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vibora}
      # OBLIGATORIO: lo exige comprobar-VIBORA_JWT_SECRET (arriba, depends_on). Defensa en profundidad: si alguien
      # arranca el backend saltandose esa comprobacion (--no-deps), el ENTRYPOINT de vibora-backend/Dockerfile se niega
      # a arrancar sin secreto y la app tampoco acepta secretos de menos de 32 bytes.
      VIBORA_JWT_SECRET: ${VIBORA_JWT_SECRET:-}
      VIBORA_WEBSOCKET_ORIGENES_PERMITIDOS: http://localhost:${FRONTEND_PORT:-8088}
      # Fotos de incidencias: los ficheros viven en el volumen vibora-uploads, no dentro del contenedor
      VIBORA_ALMACEN_DIRECTORIO: /data/uploads
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - vibora-uploads:/data/uploads
    depends_on:
      comprobar-VIBORA_JWT_SECRET:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # Sin "ports": el backend solo es alcanzable a traves de nginx (red interna de compose).
    # Para depurar desde el host, añade temporalmente:  ports: ["127.0.0.1:8081:8081"]  (ojo: choca con el
    # backend de desarrollo, que usa el 8081; usa otro puerto de host, p. ej. "127.0.0.1:18081:8081").
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    profiles: ["app"]
    build:
      context: ./vibora-frontend
    image: vibora-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  vibora-pgdata:
  vibora-uploads:
