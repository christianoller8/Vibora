spring.application.name=vibora
server.port=8081

# PostgreSQL (docker compose up -d db, desde la raíz del repo)
spring.datasource.url=jdbc:postgresql://localhost:5433/vibora
spring.datasource.username=vibora
spring.datasource.password=vibora

# JPA: el esquema lo gestiona Flyway (db/migration), Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT (HMAC-SHA256)
# !!! SOLO DESARROLLO: este secreto por defecto es publico. En cualquier otro entorno
# !!! define la variable de entorno VIBORA_JWT_SECRET (>= 32 bytes, aleatorio).
vibora.jwt.secret=${VIBORA_JWT_SECRET:dev-only-secret-NO-USAR-EN-PRODUCCION-0123456789}
vibora.jwt.expiracion-minutos=60

# WebSocket (notificaciones en tiempo real, STOMP en /ws): origenes de navegador permitidos, separados por comas
vibora.websocket.origenes-permitidos=http://localhost:4200
# Latidos STOMP del servidor (ambos sentidos) y cada cuanto se cierran los sockets cuyo JWT ya caducó (ISO-8601)
vibora.websocket.latido=10s
vibora.websocket.intervalo-barrido=PT30S

# Actuator: SOLO /actuator/health (HEALTHCHECK de Docker); sin detalles ni componentes para nadie
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# sin grupos liveness/readiness: la respuesta es exactamente {"status":"UP"}
management.endpoint.health.probes.enabled=false

# Fotos de incidencias: carpeta de ficheros subidos (en Docker: volumen vibora-uploads) y limites de multipart.
# Un fichero pasa de 5 MB -> 413. La peticion admite 1 MB mas por la envoltura multipart.
vibora.almacen.directorio=${VIBORA_ALMACEN_DIRECTORIO:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat rechaza una subida por su Content-Length (> max-request-size) SIN leer el cuerpo; si despues no puede descartar
# lo que queda (por defecto solo traga 2 MB) cierra la conexion y el cliente ve un corte en vez del 413. Con 10 MB el
# cliente recibe el 413 limpio hasta ~10 MB; por encima se corta la conexion (proteccion contra cuerpos enormes).
server.tomcat.max-swallow-size=10MB

# Reservas: duracion fija de cada casilla y antelacion minima para que un jugador pueda cancelar
vibora.reservas.duracion-minutos=90
vibora.reservas.cancelacion-minima-horas=24
# Se asume que todos los clubes estan en esta zona: los Instant se pasan a hora local para buscar tarifas y horario
vibora.zona-horaria=Europe/Madrid
