<h2 mat-dialog-title>{{ textos.titulo }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>{{ textos.etiqueta }}</mat-label>
      <textarea
        matInput
        name="comentario"
        formControlName="comentario"
        rows="4"
        maxlength="2000"
        [required]="textos.obligatorio"
      ></textarea>
      <mat-hint align="end">{{ form.controls.comentario.value.length }}/{{ maximo }}</mat-hint>
      @if (form.controls.comentario.hasError('maxlength')) {
        <mat-error>El comentario no puede superar los 2000 caracteres</mat-error>
      } @else {
        <mat-error>Indica el motivo</mat-error>
      }
    </mat-form-field>

    @if (error(); as mensaje) {
      <p class="error" role="alert">{{ mensaje }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" data-accion="cancelar" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || enviando()">
      {{ enviando() ? 'Guardando…' : textos.confirmar }}
    </button>
  </mat-dialog-actions>
</form>
