# Cabeceras de seguridad comunes (se incluyen en cada location que sirve ficheros estaticos, porque add_header
# de un location anula las del nivel superior). La Content-Security-Policy se genera en el build: gen-csp.mjs.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
