# Sustituye a /etc/nginx/conf.d/default.conf de la imagen nginx-unprivileged (escucha en 8080, usuario sin privilegios).
# Sirve la SPA y hace de proxy inverso hacia el backend: mismo origen para el navegador, asi que no hace falta CORS.

# Cabecera Connection correcta para el proxy: "upgrade" solo cuando el cliente pide WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    # DNS interno de Docker: el nombre "backend" se resuelve al hacer cada peticion (no al arrancar nginx),
    # asi nginx arranca aunque el backend aun no exista y sigue la IP nueva si el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Proxy inverso -------------------------------------------------------------------------------------
    location /api/ {
        set $backend "backend:8081";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # El health del backend es para el HEALTHCHECK interno del contenedor: no se publica (y tampoco debe caer
    # en el fallback de la SPA devolviendo un 200 engañoso).
    location ^~ /actuator {
        return 404;
    }

    # STOMP sobre WebSocket (notificaciones en tiempo real)
    location /ws {
        set $backend "backend:8081";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        # la conexion vive mientras el usuario tenga la app abierta
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # --- Estaticos -----------------------------------------------------------------------------------------
    # index.html (y cualquier ruta de la SPA, que cae aqui por try_files): nunca en cache, para que un despliegue
    # nuevo se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Ficheros con hash en el nombre (main-XXXX.js, styles-XXXX.css...): el contenido nunca cambia bajo el mismo nombre.
    # (la regex va entre comillas porque lleva llaves)
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|avif|map)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Resto de ficheros reales (favicon.ico...): cache corta. Cualquier otra ruta es de la SPA -> index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }
}
