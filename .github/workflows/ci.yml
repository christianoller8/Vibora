name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vibora-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      # Los tests de integracion usan Testcontainers (PostgreSQL): los runners de ubuntu traen Docker.
      - name: Compilar y ejecutar tests
        run: ./mvnw -B verify

      - name: Subir informes de surefire si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: vibora-backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (tests y build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibora-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vibora-frontend/package-lock.json

      - run: npm ci

      - name: Tests (Vitest)
        run: npx ng test --watch=false

      - name: Build de produccion
        run: npx ng build --configuration production

  scripts:
    name: Scripts (helper de fechas)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: node --test "scripts/lib/*.test.mjs"

  docker:
    name: Docker (imagenes y smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend, scripts]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false -> solo se comprueba que las imagenes construyen; load: true las deja disponibles para compose.
      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./vibora-backend
          push: false
          load: true
          tags: vibora-backend:local
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./vibora-frontend
          push: false
          load: true
          tags: vibora-frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Preparar .env de CI (secreto desechable)
        run: |
          {
            echo "VIBORA_JWT_SECRET=$(openssl rand -base64 48)"
            echo "FRONTEND_PORT=8088"
          } > .env

      # Sin --build: compose reutiliza las imagenes vibora-*:local que acaban de cargarse.
      - name: Levantar el stack completo
        run: docker compose --profile app up -d --wait --wait-timeout 240

      - name: Smoke test a traves de nginx
        run: |
          set -euo pipefail
          base=http://localhost:8088

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/")
          echo "GET / -> $code"; test "$code" = 200

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/deudas")
          echo "GET /deudas (ruta de la SPA) -> $code"; test "$code" = 200

          body=$(curl -s -w '\n%{http_code}' "$base/api/auth/me")
          echo "GET /api/auth/me -> $body"
          test "$(echo "$body" | tail -n1)" = 401
          echo "$body" | head -n1 | grep -q '"error"'

          # El health del backend solo es para el HEALTHCHECK interno: nginx no lo publica.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/actuator/health")
          echo "GET /actuator/health (publico) -> $code"; test "$code" = 404

      - name: Volcar estado y logs si algo falla
        if: failure()
        run: |
          docker compose --profile app ps -a
          docker compose --profile app logs --no-color --tail=200

      - name: Parar y borrar el stack
        if: always()
        run: docker compose --profile app down -v
